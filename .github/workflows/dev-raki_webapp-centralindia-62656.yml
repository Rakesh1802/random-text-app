# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - webapp-centralindia-62656 and webapp-eastasia-31557

on:
  push:
    branches:
      - dev/raki
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      # checkout code
      - uses: actions/checkout@v4

      # Set node version
      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'
      
      # Install production dependencies
      - name: Install dependencies
        working-directory: app
        run: npm install --production

      # Create zip file.
      - name: Create deployment zip
        working-directory: app
        run: |
          zip -r ../app.zip \
            server.js \
            package.json \
            package-lock.json \
            node_modules \
            public

      # Login to Azure
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_9599A660418547D8BC6EFE9D5F5F7C6A }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_68BBAA44253144D2AB8C80618F4F2FF4 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_495F795BD35C4F03A97F9713414D973D }}

      - name: 'Deploy to Azure Web App in Central India'
        id: deploy-to-webapp-centralindia
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'webapp-centralindia-62656'
          slot-name: 'Production'
          package: app.zip

      - name: 'Deploy to Azure Web App in East Asia'
        id: deploy-to-webapp-eastasia
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'webapp-eastasia-31557'
          slot-name: 'Production'
          package: app.zip