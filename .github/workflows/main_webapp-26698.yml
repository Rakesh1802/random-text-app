# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - webapp-55820

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      # checkout code
      - uses: actions/checkout@v4

      # Set node version
      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'
      
      # Install production dependencies
      - name: Install dependencies
        working-directory: app
        run: npm install --production

      # Create zip file.
      - name: Create deployment zip
        working-directory: app
        run: |
          zip -r ../app.zip \
            server.js \
            package.json \
            package-lock.json \
            node_modules \
            public

      # Login to Azure
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_DEE99586B9194614B0946ACB82C83C46 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_F107D996F2D040F3A7725566A36219B3 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_E227DED5191142C0ABE7065F11FB0569 }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'webapp-26698'
          slot-name: 'Production'
          package: app.zip
          